<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 400px;">
        <h1 style="margin-bottom: 20px;">Login</h1>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="margin-bottom: 15px; padding: 10px; background-color: #f8d7da; color: #721c24; border-radius: 4px;">
            {% for message in messages %}
              <p style="margin: 0; text-align: center;">{{ message }}</p>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <input type="text" name="username" placeholder="Username" required style="width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <input type="password" name="password" placeholder="Password" required style="width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <button type="submit" style="width: 100%; padding: 12px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 20px;">Don't have an account? <a href="{{ url_for('register') }}" style="color: #2980b9;">Register here</a>.</p>
    </div>
</body>
</html>
